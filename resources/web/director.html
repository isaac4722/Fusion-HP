<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuminaPresentation — Pantalla Director / Instrucciones</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#10141c;color:#e8ecf4;width:100%;height:100%;overflow:hidden;
 font-family:system-ui,'Segoe UI',Roboto,sans-serif}
#wrap{display:flex;flex-direction:column;height:100vh;padding:3vh 4vw;gap:1.6vh}
#top{display:flex;justify-content:space-between;align-items:center}
#clock{font-size:clamp(22px,3vw,40px);font-weight:700;color:#ffd166}
#count{font-size:clamp(20px,2.6vw,34px);font-weight:700;color:#ff5555}
#item{font-size:clamp(22px,3.2vw,44px);font-weight:700;color:#6ec1ff;line-height:1.15;
 overflow:hidden;flex:0 1 auto}
#text{font-size:clamp(17px,2.3vw,30px);line-height:1.35;color:#e8ecf4;white-space:pre-line;
 overflow:auto;flex:3}
#notes{font-size:clamp(14px,1.8vw,24px);color:#b8c0cc;font-style:italic}
#nextbox{background:#1a2230;border-radius:10px;padding:1.6vh 2vw;flex:1.6;
 display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#nexttitle{font-size:clamp(18px,2.4vw,32px);font-weight:700;color:#9be564;line-height:1.2}
#nexttext{font-size:clamp(14px,1.9vw,25px);color:#b8c0cc;white-space:pre-line;margin-top:.6vh}
#messages{font-size:clamp(14px,1.8vw,24px);color:#ffd166;white-space:pre-line;flex:1.4;
 overflow:auto}
#messages b{color:#ffe08a}
.off{opacity:.35}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="clock">--:--:--</div>
    <div id="count"></div>
  </div>
  <div id="item">—</div>
  <div id="text"></div>
  <div id="notes"></div>
  <div id="nextbox">
    <div id="nexttitle">SIGUIENTE —</div>
    <div id="nexttext"></div>
  </div>
  <div id="messages"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// v1.6.0 (M2): reenvio del token de la API si la pagina se abrio con ?token=...
const TOKEN=new URLSearchParams(location.search).get('token')||'';
const TOKQ=TOKEN?('?token='+encodeURIComponent(TOKEN)):'';
let last='';
async function poll(){
  try{
    const r=await fetch('/api/director.json'+TOKQ,{cache:'no-store'});
    const st=await r.json();
    const sig=JSON.stringify(st);
    if(sig===last){tick(st);return}
    last=sig;
    $('item').textContent=st.item||'—';
    $('text').textContent=st.text||'';
    $('notes').textContent=st.notes?('Nota: '+st.notes):'';
    $('nexttitle').textContent=st.nextItem?('SIGUIENTE · '+st.nextItem):'SIGUIENTE —';
    $('nexttext').textContent=st.nextText||'';
    if(st.messages&&st.messages.length){
      $('messages').innerHTML=st.messages.map(m=>esc(m)).join('<br>');
    }
    tick(st);
  }catch(e){/* servidor no disponible: pantalla se mantiene */}
}
function tick(st){
  const d=new Date();
  $('clock').textContent=d.toLocaleTimeString();
  if(st&&st.countdown>0){
    const h=Math.floor(st.countdown/3600),m=Math.floor(st.countdown%3600/60),s=st.countdown%60;
    $('count').textContent='Temporizador: '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }else if(st&&st.countdown===0){
    $('count').textContent='¡TIEMPO!';
  }else{
    $('count').textContent='';
  }
}
setInterval(poll,1000);
poll();
</script>
</body>
</html>
