<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LuminaPresentation — Overlay OBS (Alpha Key)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Fondo 100% transparente para superposicion en OBS/vMix (alpha key / chroma) */
html,body{background:transparent !important;width:100%;height:100%;overflow:hidden}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
 padding:4vh 6vw;text-align:center;transition:opacity .35s ease}
#ref{font:600 clamp(14px,2.2vw,26px)/1.2 system-ui,Segoe UI,Roboto,sans-serif;color:#ffd166;
 text-shadow:0 2px 6px rgba(0,0,0,.9);margin-bottom:1.2vh}
#text{font:700 clamp(22px,4.6vw,64px)/1.28 system-ui,Segoe UI,Roboto,sans-serif;color:#ffffff;
 text-shadow:0 3px 10px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8);white-space:pre-line}
#alert{position:absolute;top:2vh;left:50%;transform:translateX(-50%);
 font:700 clamp(14px,2.4vw,30px)/1.3 system-ui,Segoe UI,sans-serif;color:#ffe08a;
 background:rgba(0,0,0,.55);border-radius:12px;padding:10px 22px;opacity:0;transition:opacity .3s}
#alert.show{opacity:1}
.hidden{opacity:0 !important}
</style>
</head>
<body>
<div id="alert"></div>
<div id="wrap">
  <div id="ref"></div>
  <div id="text"></div>
</div>
<script>
// v1.6.0 (M2): reenvio del token de la API si la pagina se abrio con ?token=...
const TOKEN=new URLSearchParams(location.search).get('token')||'';
const TOKQ=TOKEN?('?token='+encodeURIComponent(TOKEN)):'';
let last='';
const REF=document.getElementById('ref'), TXT=document.getElementById('text'),
      WRAP=document.getElementById('wrap'), AL=document.getElementById('alert');
let alertTimer=null;

async function poll(){
  try{
    const r=await fetch('/api/overlay.json'+TOKQ,{cache:'no-store'});
    const st=await r.json();
    const lines=(st.lines||[]).join('\n');
    const sig=JSON.stringify([st.mode,st.ref,lines,st.alert]);
    if(sig!==last){
      last=sig;
      if(st.mode==='content'&&lines){
        REF.textContent=st.ref?('['+st.ref+']'):'';
        TXT.textContent=lines;
        WRAP.classList.remove('hidden');
      }else if(st.mode==='logo'){
        WRAP.classList.add('hidden');
      }else if(st.mode==='clear'){
        REF.textContent='';TXT.textContent='';WRAP.classList.remove('hidden');
      }else{
        WRAP.classList.add('hidden');
      }
    }
    if(st.alert){
      AL.textContent=st.alert;AL.classList.add('show');
      clearTimeout(alertTimer);
      alertTimer=setTimeout(()=>AL.classList.remove('show'),12000);
    }else{
      AL.classList.remove('show');
    }
  }catch(e){ /* OBS reintenta solo */ }
}
setInterval(poll, 400);
poll();
</script>
</body>
</html>
