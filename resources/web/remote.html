<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LuminaPresentation — Control Remoto</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{background:#0d1220;color:#e6ecf8;padding:14px;max-width:520px;margin:0 auto}
h1{font-size:18px;color:#7db6ff;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#ff5555;display:inline-block}
.dot.on{background:#3ddc84}
.card{background:#161d33;border-radius:14px;padding:12px;margin-bottom:12px}
#current{min-height:70px;font-size:17px;font-weight:600;line-height:1.35}
#ref{color:#8fa3c8;font-size:13px;margin-top:6px}
#count{color:#8fa3c8;font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:16px 10px;font-size:16px;font-weight:700;color:#fff;
background:#22406e;cursor:pointer;transition:transform .05s, background .15s}
button:active{transform:scale(.97)}
button.primary{background:#1e6fd9;grid-column:1 / span 2;font-size:20px;padding:22px}
button.wide{grid-column:1 / span 2}
button.warn{background:#8f2d2d}
button.gold{background:#8a6d1f}
#alert{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:1px solid #2c3a5e;
background:#101728;color:#e6ecf8;font-size:15px}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;padding:12px}
#status{text-align:center;color:#8fa3c8;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1><span id="conn" class="dot"></span> LuminaPresentation — Remoto</h1>

<div class="card">
  <div id="current">— sin contenido —</div>
  <div id="ref"></div>
  <div id="count"></div>
</div>

<div class="grid">
  <button class="primary" id="next">▶ Siguiente</button>
  <button id="prev">◀ Anterior</button>
  <button id="clear">🖼 Solo fondo</button>
  <button id="black">⬛ Negro</button>
  <button id="logo">✝ Logo</button>
  <button id="qprev">⏮ Culto: anterior</button>
  <button id="qnext">⏭ Culto: siguiente</button>
</div>

<div class="card" style="margin-top:12px">
  <input id="alert" placeholder="Enviar alerta al escenario…">
  <div class="row">
    <button id="sendAlert">📣 Enviar alerta</button>
  </div>
</div>

<div id="status">conectando…</div>

<script>
let ws=null, retry=0;
function connect(){
  // %%WSPORT%% lo sustituye el servidor embebido con el puerto WS real
  const wsPort=(typeof WSPORT!=='undefined')?WSPORT:%%WSPORT%%;
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.hostname+':'+wsPort);
  ws.onopen=()=>{document.getElementById('conn').classList.add('on');document.getElementById('status').textContent='conectado';retry=0;};
  ws.onclose=()=>{document.getElementById('conn').classList.remove('on');document.getElementById('status').textContent='reconectando…';
    setTimeout(connect, Math.min(3000*Math.pow(1.5,retry++),15000));};
  ws.onmessage=e=>{
    try{
      const st=JSON.parse(e.data);
      if(st.ev!=='state') return;
      const el=document.getElementById('current');
      el.textContent=(st.lines&&st.lines.length)?st.lines.join('\n'):'— sin contenido —';
      document.getElementById('ref').textContent=st.ref?('['+st.ref+'] '+st.title):'';
      document.getElementById('count').textContent=(st.count?('slide '+(st.index+1)+' de '+st.count):'');
    }catch(err){}
  };
}
function send(cmd,data){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({cmd:cmd,data:data||{}})); }
document.getElementById('next').onclick=()=>send('next');
document.getElementById('prev').onclick=()=>send('prev');
document.getElementById('black').onclick=()=>send('black');
document.getElementById('clear').onclick=()=>send('clear');
document.getElementById('logo').onclick=()=>send('logo');
document.getElementById('qnext').onclick=()=>send('qnext');
document.getElementById('qprev').onclick=()=>send('qprev');
document.getElementById('sendAlert').onclick=()=>{const a=document.getElementById('alert');if(a.value.trim()){send('alert',{text:a.value.trim()});a.value='';}};
connect();
</script>
</body>
</html>
