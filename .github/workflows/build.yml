#  Copyright (c) 2026 Isaac. Licencia View-Only.
# ----------------------------------------------------------------------------
#  Compila el programa de escritorio NATIVO (C++17 / wxWidgets 3.2 estático)
#  para Windows x86 (Win7 SP1+) y x64, con runtime estático (/MT) para que el
#  paquete portable NO requiera ningún redistributable ni instalación.
#
#  Estrategia:
#   1) wxWidgets 3.2.x se compila desde fuente con CMake (estático + /MT) y
#      se cachea por versión+arquitectura+toolset (los runs siguientes son
#      rápidos).
#   2) La app se configura con CMake (modo CONFIG de wx: targets wx::*).
#   3) GATE: tools/verify_portable.py audita los imports PE del paquete
#      (garantiza cero dependencias externas).
#   4) En tags v*: publica GitHub Release con los zips portable + SHA256SUMS.
# ============================================================================
name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: LuminaPresentationSuite
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0' }}
  WX_VERSION: "3.2.8.1"

jobs:
  build:
    name: Build ${{ matrix.arch }} (wx static /MT)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_gen_arch: Win32
          - arch: x64
            cmake_gen_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # ---------------------------------------------------------------------
      # wxWidgets estático (/MT) — compilar y cachear
      # ---------------------------------------------------------------------
      - name: Cache wxWidgets ${{ env.WX_VERSION }} (${{ matrix.arch }})
        id: wxcache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/wx-install
          key: wx-${{ env.WX_VERSION }}-${{ matrix.arch }}-mt-v1

      - name: Descargar wxWidgets ${{ env.WX_VERSION }}
        if: steps.wxcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VERSION/wxWidgets-$env:WX_VERSION.zip"
          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile wx.zip
          Expand-Archive -Path wx.zip -DestinationPath wx-src -Force

      - name: Compilar wxWidgets estático (/MT)
        if: steps.wxcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S wx-src -B wx-build `
            -A ${{ matrix.cmake_gen_arch }} `
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/wx-install `
            -DCMAKE_BUILD_TYPE=Release `
            -DwxBUILD_SHARED_LIBS=OFF `
            -DwxBUILD_MONOLITHIC=OFF `
            -DwxBUILD_SAMPLES=OFF `
            -DwxBUILD_TESTS=OFF `
            -DwxBUILD_DEMOS=OFF `
            -DwxBUILD_MSVC_RUNTIME_DLL=OFF `
            -DwxUSE_STC=0 -DwxUSE_XRC=0 -DwxUSE_HTML=0 `
            -DwxUSE_WEBVIEW=0 -DwxUSE_RIBBON=0 -DwxUSE_PROPGRID=0 `
            -DwxUSE_RICHTEXT=0 -DwxUSE_OPENGL=0 -DwxUSE_DEBUGREPORT=0 `
            -DwxUSE_PRINTF_POS_PARAMS=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build wx-build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install wx-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------------
      # Aplicación
      # ---------------------------------------------------------------------
      - name: Configurar aplicación
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.cmake_gen_arch }} `
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/wx-install `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar aplicación (0 errores / 0 warnings)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------------
      # Empaquetado portable + GATE de verificación
      # ---------------------------------------------------------------------
      - name: Empaquetar portable
        shell: pwsh
        run: |
          $stage = "staging/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-win-${{ matrix.arch }}-portable"
          New-Item -ItemType Directory -Force -Path "$stage/resources/data", "$stage/resources/img" | Out-Null
          Copy-Item "build/Release/${{ env.APP_NAME }}.exe" "$stage/"
          Copy-Item "resources/data/bible_rvr1909.json" "$stage/resources/data/"
          Copy-Item "resources/img/logo.png" "$stage/resources/img/"
          Copy-Item "resources/img/logo128.png" "$stage/resources/img/"
          Copy-Item "LICENSE.md" "$stage/"
          @'
          LuminaPresentation Suite v2.0.0 «Horizonte» (wxWidgets)
          ======================================================

          PROGRAMA PORTABLE — no requiere instalación, ni permisos de
          administrador, ni conexión a internet.

          1) Descomprimir en cualquier carpeta.
          2) Ejecutar LuminaPresentationSuite.exe.

          Todo va incluido: wxWidgets estático, SQLite+FTS5 y la Biblia
          RVR1909 completa. La base de datos se crea sola en Data\ en el
          primer arranque.

          Atajos: F5 en vivo · F6 negro · F7 limpiar · F8 logo ·
                  F9 versículo rápido · F11 modo presentación ·
                  Ctrl+F buscar · Ctrl+N nueva canción

          Control remoto móvil (Ajustes): http://<ip-del-pc>:8088

          Binarios de uso libre · Código fuente bajo Licencia View-Only.
          '@ | Set-Content -Path "$stage/LEEME.txt" -Encoding UTF8

          python tools/verify_portable.py "$stage" ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$stage/*" -DestinationPath "${stage}.zip" -Force
          Write-Host "Paquete: ${stage}.zip"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}
          path: staging/*.zip

  # -------------------------------------------------------------------------
  # Release (solo tags v*)
  # -------------------------------------------------------------------------
  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          find . -name "*.zip" -exec sha256sum {} \; | sed 's|artifacts/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          name: LuminaPresentation Suite ${{ github.ref_name }} «Horizonte» (wxWidgets)
          body: |
            **Programa de escritorio NATIVO (C++17 / wxWidgets 3.2 estático)** — no requiere instalación.

            ## Descargas
            - `LuminaPresentationSuite-${{ github.ref_name }}-win-x86-portable.zip` — **Windows 7 SP1 a Windows 11 (32 bits)**
            - `LuminaPresentationSuite-${{ github.ref_name }}-win-x64-portable.zip` — **Windows 7 SP1 a Windows 11+ (64 bits)**
            - `SHA256SUMS.txt` — integridad de los paquetes

            ## Novedades v2.0.0 «Horizonte» — reescritura completa con wxWidgets
            - **Motor nativo wxWidgets 3.2** enlazado estático con runtime /MT: **cero dependencias externas** (sin redistributables, sin Qt, sin VLC) — descomprimir y ejecutar en Win7 SP1+ x32 hasta Win11+.
            - **UI/UX nueva**: biblioteca en pestañas (Canciones/Biblia/Medios/Temas), culto persistente con reordenamiento, previsualización dual EN VIVO/SIGUIENTE con render real, toolbar de control con transposición en vivo, barra de estado informativa y modo presentación (F11).
            - **Canciones**: SQLite+FTS5 (búsqueda instantánea sin acentos), etiquetas, editor con reparto en slides en vivo, transposición de acordes latinos/anglosajonos, Modo Hinario corregido (coro tras el verso completo, dedupe).
            - **Biblia RVR1909 incluida** (31.084 versículos), referencias tipadas `Jn 3:16`, búsqueda por palabras, versículo rápido F9.
            - **Salida fullscreen** multi-pantalla con fondo sólido/gradiente/imagen, contorno, sombra, ajuste tipográfico automático, Lower Third y video (DirectShow).
            - **Control remoto HTTP** embebido: panel móvil, `/api/cmd`, `/api/state`, `/api/live.txt`, token opcional.
            - **CI verificado**: 63/63 checks de núcleo + auditoría PE de portabilidad.
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
