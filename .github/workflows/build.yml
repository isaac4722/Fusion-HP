# ============================================================================
#  LuminaPresentation Suite - CI/CD
#  Compila binarios nativos Windows x86 + x64 (Qt 5.15.2 MinGW 7.3),
#  empaqueta portable con Qt + LibVLC + licencias y publica el Release.
#  Trigger: push de tags v* | workflow_dispatch | push a main (solo artefactos)
# ============================================================================
name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: LuminaPresentationSuite
  VLC_VERSION: "3.0.21"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_mingw81
            mingw_tool: qt.tools.win64_mingw810
            vlc_url: https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.7z
          - arch: x86
            qt_arch: win32_mingw81
            mingw_tool: qt.tools.win32_mingw810
            vlc_url: https://download.videolan.org/pub/videolan/vlc/3.0.21/win32/vlc-3.0.21-win32.7z

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (MinGW, ${{ matrix.arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: 'qt-5152-${{ matrix.arch }}'
          setup-python: 'false'

      - name: Install MinGW 8.1 toolchain (${{ matrix.arch }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet --disable-pip-version-check aqtinstall
          python -m aqt tool windows tools_mingw81 ${{ matrix.mingw_tool }} -O "$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "aqt tool fallo" }
          $mingwBin = Get-ChildItem -Path "$env:QT_ROOT_DIR\Tools" -Directory | `
            Where-Object { $_.Name -like 'mingw810*' } | Select-Object -First 1
          if (-not $mingwBin) { throw "No se encontro la carpeta de MinGW 8.1" }
          $binPath = Join-Path $mingwBin.FullName 'bin'
          echo "MINGW_BIN=$binPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MinGW en: $binPath"

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          echo "$env:MINGW_BIN" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          gcc --version | Select-Object -First 1

      - name: Download LibVLC ${{ env.VLC_VERSION }} (${{ matrix.arch }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri '${{ matrix.vlc_url }}' -OutFile "vlc.7z" -MaximumRedirection 10
          & "C:\Program Files\7-Zip\7z.exe" x "vlc.7z" -o"vlc_dist" -y | Out-Null
          if (-not (Test-Path "vlc_dist/vlc/libvlc.dll")) { throw "libvlc.dll no encontrada tras extraer" }
          Write-Host "VLC extraido OK"

      - name: Configure (CMake)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          if ($LASTEXITCODE -ne 0) { throw "Fallo la configuracion CMake" }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "Fallo la compilacion" }

      - name: Deploy (windeployqt + VLC + licencias)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "deploy_stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build\${{ env.APP_NAME }}.exe" "$stage\"
          # DLLs de Qt + plugins (sin runtime del compilador ni traducciones)
          windeployqt --release --no-compiler-runtime --no-translations --no-system-d3d-compiler `
            --no-opengl-sw "$stage\${{ env.APP_NAME }}.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt fallo" }
          # Motor VLC embebido (carga dinamica en runtime)
          New-Item -ItemType Directory -Force -Path "$stage\vlc" | Out-Null
          Copy-Item "vlc_dist\vlc\libvlc.dll"    "$stage\vlc\"
          Copy-Item "vlc_dist\vlc\libvlccore.dll" "$stage\vlc\"
          if (Test-Path "vlc_dist\vlc\libcompat.dll") { Copy-Item "vlc_dist\vlc\libcompat.dll" "$stage\vlc\" }
          if (Test-Path "vlc_dist\vlc\AUTHORS") { Copy-Item "vlc_dist\vlc\AUTHORS" "$stage\vlc\VLCAuthors.txt" }
          Copy-Item "vlc_dist\vlc\plugins" "$stage\vlc\plugins" -Recurse
          # Licencias y documentacion
          Copy-Item "LICENSE.md" "$stage\"
          Copy-Item "README.md" "$stage\"
          Write-Host "Staging listo"

      - name: Package (zip + SHA256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "${{ env.APP_NAME }}-1.0.0-${{ matrix.arch }}-portable"
          Compress-Archive -Path "deploy_stage\*" -DestinationPath "$out.zip" -Force
          $hash = (Get-FileHash "$out.zip" -Algorithm SHA256).Hash
          "$hash  $out.zip" | Out-File -Encoding ascii "SHA256SUMS-${{ matrix.arch }}.txt"
          Get-Content "SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-1.0.0-${{ matrix.arch }}-portable
          path: |
            LuminaPresentationSuite-1.0.0-${{ matrix.arch }}-portable.zip
            SHA256SUMS-${{ matrix.arch }}.txt
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-1.0.0-x64-portable
          path: artifacts/x64
      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-1.0.0-x86-portable
          path: artifacts/x86

      - name: Prepare release files
        run: |
          mkdir -p rel
          cp artifacts/x64/LuminaPresentationSuite-1.0.0-x64-portable.zip rel/
          cp artifacts/x86/LuminaPresentationSuite-1.0.0-x86-portable.zip rel/
          cat artifacts/x64/SHA256SUMS-x64.txt artifacts/x86/SHA256SUMS-x86.txt > rel/SHA256SUMS.txt
          ls -la rel/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: LuminaPresentation Suite ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## LuminaPresentation Suite 1.0.0

            **Proyección multimedia híbrida nativa** — C++20 / Qt 5.15 LTS · sin JVM · sin Electron.

            ### Paquetes portables (todo incluido)
            | Archivo | Arquitectura | Sistemas |
            |---|---|---|
            | `LuminaPresentationSuite-1.0.0-x64-portable.zip` | 64 bits | Windows 7 SP1 → Windows 11 |
            | `LuminaPresentationSuite-1.0.0-x86-portable.zip` | 32 bits | Windows 7 SP1 → Windows 10 |

            - Descomprimir y ejecutar `LuminaPresentationSuite.exe` — **no requiere instalación**.
            - Incluye: motor Qt, **LibVLC 3.0.21** (todos los codecs), **Biblia RVR1909 completa** y temas.
            - Verifica la integridad con `SHA256SUMS.txt`.
            - Control remoto móvil: `http://<ip-del-pc>:8088/remote.html` · Overlay OBS: `http://<ip>:8088/overlay.html`

            ### Novedades v1.0.0
            - Canciones con FTS5 instantáneo, acordes y transposición, Modo Hinario
            - Biblia multiversión con hasta 3 versiones en paralelo + versículo rápido (F9)
            - Importación PPTX nativa (OpenXML) sin Office
            - Stage View con acordes, reloj y cuenta regresiva
            - Triggers: Webhook, OBS WebSocket v5, MIDI Out, Telegram
            - Salida multipantalla con crossfade y recuperación ante desconexión
          files: |
            rel/LuminaPresentationSuite-1.0.0-x64-portable.zip
            rel/LuminaPresentationSuite-1.0.0-x86-portable.zip
            rel/SHA256SUMS.txt
