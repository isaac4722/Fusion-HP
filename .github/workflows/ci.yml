#  Fusion-HP / LuminaPresentation Suite — CI/CD híbrido v3.0.0 «HÍBRIDA»
#  Copyright (c) 2026 Isaac. Licencia View-Only.
# ----------------------------------------------------------------------------
#  Pipeline de la arquitectura híbrida (docs/architecture-hybrid.md §6):
#
#    native-windows : núcleo C++ (FusionCore.dll /MT) x86+x64 + selftest + PoC nativo
#    native-linux   : port del núcleo (GCC) — regresa rápido el estado del port
#    managed        : capa C# (net35+net48 con ref assemblies) + tests net8.0
#    interop        : PoC real C# ↔ DLL nativa (x86/x64, net48; net35 informativo)
#    clrhost-poc    : vía C — CLR hosting C++ puro contra PocFacade (x86/x64)
#    package        : layout portable por arquitectura + verify_portable + zip + SHA256
#    release        : GitHub Release solo en tags v*
#
#  CONTRATOS de rutas entre jobs (respetar al mover proyectos):
#    managed/FusionHP.sln                          (solución gestionada)
#    managed/FusionHP.UI                           (WinExe net48)
#    managed/PoC/PoC.Managed                       (net35;net48)
#    managed/PoC/PocFacade                         (net48;net35) — COM-visible
#    managed/Tests                                 (net8.0;net48)
#    Salidas: <proj>/bin/Release/<tfm>/... (SDK-style estándar de dotnet build)
#    PoC.Managed debe imprimir "POC PASS 12/12" y salir 0 cuando todo pasa.
#    PocFacade: tipo por defecto "FusionHP.PocFacade.PocFacade" (COMVisible,
#    MarshalByRefObject/Serializable para cruzar dominios) con métodos
#    Add(int,int), Echo(string), Version() -> prefijo "FUSION-FACADE-OK".
# ============================================================================

name: CI híbrido

on:
  push:
    branches: [main]
    tags: ['v*']        # necesario para que el job «release» sea alcanzable
  pull_request:
  workflow_dispatch:

# Los jobs normales solo leen; la escritura (release) se concede en su job.
permissions:
  contents: read

# Un solo CI activo por rama/PR: cancela el run anterior en progreso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  APP_VERSION: '3.0.0'

jobs:
  # ---------------------------------------------------------------------------
  # 1) Núcleo C++ en Windows: FusionCore.dll (/MT) + selftest + PoC nativo
  # ---------------------------------------------------------------------------
  native-windows:
    name: Núcleo C++ ${{ matrix.arch }} (/MT + gates)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar (CMake ${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recolectar binarios en dist/${{ matrix.arch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.arch }}" | Out-Null
          Copy-Item build/native/Release/FusionCore.dll        "dist/${{ matrix.arch }}/"
          Copy-Item build/native/Release/fusion_selftest.exe   "dist/${{ matrix.arch }}/"
          Copy-Item build/native/Release/fusion_poc_native.exe "dist/${{ matrix.arch }}/"

      - name: GATE fusion_selftest (exit 0)
        shell: pwsh
        working-directory: dist/${{ matrix.arch }}
        run: |
          ./fusion_selftest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE fusion_poc_native headless (exit 0)
        shell: pwsh
        working-directory: dist/${{ matrix.arch }}
        run: |
          ./fusion_poc_native.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir artefacto native-${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) Núcleo C++ en Linux (partes portables): señal rápida del port
  # ---------------------------------------------------------------------------
  native-linux:
    name: Núcleo C++ Linux (port)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --parallel

      - name: GATE fusion_selftest (exit 0)
        run: ./build/native/fusion_selftest

  # ---------------------------------------------------------------------------
  # 3) Capa gestionada: solución C# (net35+net48) + tests net8.0
  # ---------------------------------------------------------------------------
  managed:
    name: Capa C# (net35+net48) + tests net8.0
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Compilar solución (net35+net48 con ref assemblies)
        shell: pwsh
        run: |
          dotnet build managed/FusionHP.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests net8.0 (arnés propio; FUSION_SKIP_NATIVE=1)
        shell: pwsh
        env:
          FUSION_SKIP_NATIVE: '1'
        run: |
          dotnet run --project managed/Tests --configuration Release --framework net8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar UI net48 (self-contained false)
        shell: pwsh
        run: |
          dotnet publish managed/FusionHP.UI -f net48 -c Release --self-contained false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar artefacto «managed»
        shell: pwsh
        run: |
          $stage = 'artifacts-managed'
          New-Item -ItemType Directory -Force -Path `
            "$stage/ui-publish","$stage/poc-net48","$stage/poc-net35",`
            "$stage/pocfacade-net48","$stage/tests-net48" | Out-Null
          # UI net48 publicada (para el paquete portable)
          Copy-Item managed/FusionHP.UI/bin/Release/net48/publish/* "$stage/ui-publish/"
          # Respaldo: si el publish dejó el exe en otra carpeta, copiar del build
          if (-not (Test-Path "$stage/ui-publish/FusionHP.exe")) {
            Copy-Item managed/FusionHP.UI/bin/Release/net48/FusionHP.exe "$stage/ui-publish/"
          }
          # PoC.Managed (binarios net48 y net35)
          Copy-Item managed/PoC/PoC.Managed/bin/Release/net48/* "$stage/poc-net48/"
          Copy-Item managed/PoC/PoC.Managed/bin/Release/net35/* "$stage/poc-net35/"
          # Facade COM-visible (para el PoC de CLR hosting)
          Copy-Item managed/PoC/PocFacade/bin/Release/net48/FusionHP.PocFacade.dll "$stage/pocfacade-net48/"
          # Tests net48 (informativo)
          Copy-Item managed/Tests/bin/Release/net48/* "$stage/tests-net48/"

      - name: Subir artefacto managed
        uses: actions/upload-artifact@v4
        with:
          name: managed
          path: artifacts-managed
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4) Interop real: PoC C# (net48) contra FusionCore.dll por arquitectura
  # ---------------------------------------------------------------------------
  interop:
    name: Interop C# ↔ nativo (${{ matrix.arch }})
    needs: [native-windows, managed]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # dotnet build -f net48 produce un .exe que corre sobre .NET Framework 4.8
      # (preinstalado en windows-latest). Para x86 se fuerza PlatformTarget=x86
      # y el exe corre bajo WoW64; así el proceso casa con FusionCore.dll.
      - name: Compilar PoC.Managed net48 (${{ matrix.arch }})
        shell: pwsh
        run: |
          dotnet build managed/PoC/PoC.Managed -f net48 -c Release -p:PlatformTarget=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Colocar FusionCore.dll (${{ matrix.arch }}) junto al PoC
        shell: pwsh
        run: |
          Copy-Item "artifacts/native-${{ matrix.arch }}/FusionCore.dll" `
                    "managed/PoC/PoC.Managed/bin/Release/net48/"

      - name: 'GATE PoC net48 ${{ matrix.arch }}: «POC PASS 12/12» + exit 0'
        shell: pwsh
        working-directory: managed/PoC/PoC.Managed/bin/Release/net48
        run: |
          $out = & ./PoC.Managed.exe 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "$_" }
          if ($code -ne 0) { Write-Host "EXIT CODE: $code"; exit 1 }
          if (-not ($out -match 'POC PASS 12/12')) {
            Write-Host 'No apareció "POC PASS 12/12" en la salida'; exit 1
          }

      # Informativo: SOLO si el runtime 3.5 está disponible en el runner
      # (windows-latest no siempre lo trae). Nunca rompe el CI.
      - name: 'PoC net35 (informativo, continue-on-error)'
        continue-on-error: true
        shell: pwsh
        run: |
          $v35 = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5' -ErrorAction SilentlyContinue
          if (-not $v35 -or $v35.Install -ne 1) {
            Write-Host 'Runtime 3.5 no disponible en el runner: paso omitido (informativo).'
            exit 0
          }
          dotnet build managed/PoC/PoC.Managed -f net35 -c Release -p:PlatformTarget=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "artifacts/native-${{ matrix.arch }}/FusionCore.dll" `
                    "managed/PoC/PoC.Managed/bin/Release/net35/"
          Set-Location managed/PoC/PoC.Managed/bin/Release/net35
          $out = & ./PoC.Managed.exe 2>&1
          $out | ForEach-Object { Write-Host "$_" }
          Write-Host "EXIT CODE (informativo): $LASTEXITCODE"

  # ---------------------------------------------------------------------------
  # 5) Vía C: CLR hosting desde C++ puro contra PocFacade (x86 y x64)
  # ---------------------------------------------------------------------------
  clrhost-poc:
    name: CLR hosting C++ (${{ matrix.arch }})
    needs: [native-windows, managed]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # CMakeLists autónomo con /MT (no toca la base del núcleo).
      - name: Compilar fusion_poc_clrhost (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake -S native/poc-clrhost -B bch -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build bch --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar PocFacade net48
        shell: pwsh
        run: |
          dotnet build managed/PoC/PocFacade -f net48 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar carpeta de ejecución
        shell: pwsh
        run: |
          Copy-Item managed/PoC/PocFacade/bin/Release/net48/FusionHP.PocFacade.dll bch/Release/
          Copy-Item "artifacts/native-${{ matrix.arch }}/FusionCore.dll" bch/Release/

      - name: 'GATE CLRHOST (${{ matrix.arch }}): «CLRHOST PASS» + exit 0'
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'bch/Release/FusionHP.PocFacade.dll').Path
          $out = & ./bch/Release/fusion_poc_clrhost.exe $dll 'fusion.poc.FusionFacade' 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "$_" }
          if ($code -ne 0) { Write-Host "EXIT CODE: $code"; exit 1 }
          if (-not ($out -match 'CLRHOST PASS')) {
            Write-Host 'No apareció "CLRHOST PASS" en la salida'; exit 1
          }

  # ---------------------------------------------------------------------------
  # 6) Empaquetado portable por arquitectura + gate de verificación
  # ---------------------------------------------------------------------------
  package:
    name: Empaquetado portable (${{ matrix.arch }})
    needs: [interop, clrhost-poc]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Launcher nativo con su CMakeLists autónomo (mismo patrón que clrhost).
      - name: Compilar FusionLauncher (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake -S native/launcher -B blaunch -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build blaunch --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Armar layout portable
        shell: pwsh
        run: |
          $stage = "staging/Fusion-HP-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "$stage/resources/data" | Out-Null
          Copy-Item blaunch/Release/FusionLauncher.exe "$stage/"
          Copy-Item artifacts/managed/ui-publish/FusionHP.exe "$stage/"
          Copy-Item "artifacts/native-${{ matrix.arch }}/FusionCore.dll" "$stage/"
          Copy-Item resources/data/bible_rvr1909.json "$stage/resources/data/"
          # FusionHP35.exe: RESERVADO para cuando FusionHP.UI multi-apunte net35.
          # Hoy la UI es net48 exclusivo → se omite y se documenta en README.txt
          # (el launcher, si solo hay .NET 3.5, mostrará el mensaje con el
          #  enlace al instalador offline de 4.8).
          if (Test-Path 'artifacts/managed/ui-publish-net35/FusionHP35.exe') {
            Copy-Item artifacts/managed/ui-publish-net35/FusionHP35.exe "$stage/"
          }
          @'
          Fusion-HP v3.0.0 «HÍBRIDA» — núcleo C++ + interfaz C#
          =====================================================

          PROGRAMA PORTABLE — no requiere instalación ni permisos de
          administrador.

          1) Descomprimir en cualquier carpeta.
          2) Ejecutar FusionLauncher.exe: detecta el runtime .NET
             disponible y lanza la variante correcta de la interfaz.

          Requisitos (uno de los dos, ya incluidos de fábrica):
            • Windows 10 1903+ / Windows 11 → .NET Framework 4.8 integrado.
            • Windows 7 SP1 / 8.x           → .NET Framework 3.5 integrado.

          NOTA: esta versión incluye la interfaz FusionHP.exe (.NET 4.8).
          En Windows 7 SP1 sin .NET 4.8, instale el paquete offline:
          https://dotnet.microsoft.com/download/dotnet-framework/net48

          Contenido: FusionLauncher.exe (detección de runtime),
          FusionHP.exe (interfaz), FusionCore.dll (motor C++ nativo /MT)
          y la Biblia RVR1909 completa (resources/data).

          Binarios de uso libre · Código fuente bajo Licencia View-Only.
          '@ | Set-Content -Path "$stage/README.txt" -Encoding UTF8

      - name: GATE verify_portable (${{ matrix.arch }})
        shell: pwsh
        run: |
          python tools/verify_portable.py "staging/Fusion-HP-${{ matrix.arch }}" ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ZIP + SHA256
        shell: pwsh
        run: |
          $zip = "Fusion-HP-${{ env.APP_VERSION }}-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path "staging/Fusion-HP-${{ matrix.arch }}/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content -Path SHA256SUMS.txt -Encoding ASCII
          Write-Host "$hash  $zip"

      - name: Subir artefacto portable-${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}
          path: |
            Fusion-HP-*.zip
            SHA256SUMS.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 7) Release: solo en tags v*
  # ---------------------------------------------------------------------------
  release:
    name: Publicar Release (tags v*)
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # crear la release y subir assets
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: SHA256SUMS combinado
        run: |
          cd artifacts
          find . -name '*.zip' -print0 | sort -z | xargs -0 sha256sum | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          name: "Fusion-HP ${{ github.ref_name }} «HÍBRIDA»"
          body: |
            **Fusion-HP v3.0.0 «HÍBRIDA» — núcleo C++ + interfaz C# .NET Framework 4.8/3.5**

            ## Descargas
            - `Fusion-HP-3.0.0-win-x86.zip` — **Windows 7 SP1 a Windows 11 (32 bits)**
            - `Fusion-HP-3.0.0-win-x64.zip` — **Windows 7 SP1 a Windows 11+ (64 bits)**
            - `SHA256SUMS.txt` — integridad de los paquetes

            ## Arquitectura híbrida
            - **Motor nativo C++17** (`FusionCore.dll`, /MT estático): proyección en ventanas Win32, SQLite+FTS5, parser de canciones JSON y biblias .BIB — cero dependencias externas.
            - **Interfaz C# WinForms** (`FusionHP.exe`, .NET Framework 4.8): editor de escenarios, bibliotecas, API HTTP local.
            - **FusionLauncher.exe** (nativo, /MT): detecta el runtime disponible por registro y lanza la variante correcta — el usuario **nunca instala nada**.

            ## Verificación CI (todas las gates verdes)
            - Núcleo: selftest nativo + PoC API headless (x86 y x64, Windows y Linux).
            - Gestionado: build net35+net48 con ref assemblies + tests net8.0.
            - Interop real: PoC C# ↔ DLL nativa «POC PASS 12/12» en x86 y x64.
            - CLR hosting (vía C de respaldo): «CLRHOST PASS» en x86 y x64.
            - Empaquetado: auditoría PE `verify_portable` + SHA256 por paquete.

            ## Instalación
            Descomprimir y ejecutar `FusionLauncher.exe`. En Win10 1903+/Win11 usa
            .NET 4.8 integrado; en Win7 SP1 integra .NET 3.5 o instala 4.8 offline:
            https://dotnet.microsoft.com/download/dotnet-framework/net48
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
