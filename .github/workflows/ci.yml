# ============================================================================
#  Fusion-HP · CI [AGENT.md paso 8]: compilación dual x86+x64 obligatoria,
#  tests nativos y administrados, gate de prohibiciones, instalador Inno Setup
#  y paquete portable. En tags v*: sube artefactos de release.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # ---------------------------------------------------------------- núcleo nativo
  nucleo:
    name: Núcleo C++ (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Buscar MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild no encontrado' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compilar núcleo ${{ matrix.arch }}
        shell: pwsh
        run: |
          $platform = '${{ matrix.arch }}' -eq 'x86' ? 'Win32' : 'x64'
          & "${{ steps.msbuild.outputs.path }}" src/core/FusionHP.vcxproj /p:Configuration=Release /p:Platform=$platform /m /v:m /nologo
          if ($LASTEXITCODE -ne 0) { throw "compilación $platform falló" }
          Test-Path "dist/$platform/FusionHP.exe"

      - name: Compilar y ejecutar tests nativos ${{ matrix.arch }}
        shell: pwsh
        run: |
          $platform = '${{ matrix.arch }}' -eq 'x86' ? 'Win32' : 'x64'
          & "${{ steps.msbuild.outputs.path }}" tests/native/CoreTests.vcxproj /p:Configuration=Release /p:Platform=$platform /m /v:m /nologo
          if ($LASTEXITCODE -ne 0) { throw "tests $platform no compilaron" }
          $exe = "dist/tests/$platform/CoreTests.exe"
          if (-not (Test-Path $exe)) { throw "CoreTests.exe no está en $exe" }
          Copy-Item tests/fixtures -Destination dist/tests/$platform/fixtures -Recurse -Force
          $exeAbs = (Resolve-Path $exe).Path
          & $exeAbs
          if ($LASTEXITCODE -ne 0) { throw "tests nativos $platform FALLAN" }

      - name: Subir binarios del núcleo
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch == 'x86' && 'Win32' || 'x64' }}/FusionHP.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- capa administrada
  gestionada:
    name: Capa C# (net48 + net35) + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar y compilar FusionShared (net35)
        shell: pwsh
        run: |
          dotnet restore src/managed/FusionShared/FusionShared.csproj
          dotnet build src/managed/FusionShared/FusionShared.csproj -c Release --no-restore -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionShared net35 no compiló' }

      - name: Compilar FusionStudio (net48, WinForms+WPF)
        shell: pwsh
        run: |
          dotnet build src/managed/FusionStudio/FusionStudio.csproj -c Release -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionStudio net48 no compiló' }

      - name: Compilar FusionStudio.Lite (net35, perfil B)
        shell: pwsh
        run: |
          dotnet build src/managed/FusionStudio.Lite/FusionStudio.Lite.csproj -c Release -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionStudio.Lite net35 no compiló' }

      - name: Tests administrados (net48)
        shell: pwsh
        run: |
          dotnet build tests/managed/FusionTests.csproj -c Release -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionTests no compiló' }
          & "tests/managed/bin/Release/FusionTests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'tests administrados FALLAN' }

      - name: Subir binarios administrados
        uses: actions/upload-artifact@v4
        with:
          name: gestionada
          path: |
            src/managed/FusionShared/bin/Release/FusionShared.dll
            src/managed/FusionStudio/bin/Release/FusionStudio.exe
            src/managed/FusionStudio.Lite/bin/Release/FusionStudio.Lite.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- gate de calidad
  gate:
    name: Gate de calidad (auditoría de prohibiciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditoría de prohibiciones [SPEC §3.5, §11.4]
        run: bash scripts/quality_gate.sh

  # ---------------------------------------------------------------- paquete + instalador
  instalador:
    name: Instalador dual + portable
    runs-on: windows-latest
    needs: [nucleo, gestionada, gate]
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Preparar staging (ambas arquitecturas)
        shell: pwsh
        run: |
          $root = "dist-artifacts"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          # núcleo
          Copy-Item "$root/nucleo-x86/FusionHP.exe"      staging/FusionHP.x86.exe
          Copy-Item "$root/nucleo-x64/FusionHP.exe"      staging/FusionHP.x64.exe
          # administrada
          Copy-Item "$root/gestionada/FusionShared.dll"  staging/
          Copy-Item "$root/gestionada/FusionStudio.exe"  staging/
          Copy-Item "$root/gestionada/FusionStudio.Lite.exe" staging/
          # recursos
          New-Item -ItemType Directory -Force -Path staging/resources/img | Out-Null
          Copy-Item resources/img/* staging/resources/img/ -ErrorAction SilentlyContinue
          # datos de muestra
          New-Item -ItemType Directory -Force -Path staging/datos/bibles | Out-Null
          # arranque: FusionHP.exe final por arquitectura (renombrado al instalar)
          Get-ChildItem staging
          if (-not (Test-Path staging/FusionHP.x86.exe)) { throw 'falta núcleo x86' }
          if (-not (Test-Path staging/FusionHP.x64.exe)) { throw 'falta núcleo x64' }

      - name: Compilar instalador Inno Setup (dual)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = Get-ChildItem "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue }
          if (-not $iscc) { throw 'Inno Setup 6 no está instalado en el runner' }
          & $iscc.FullName installer/FusionHP.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC falló' }
          Get-ChildItem dist/installer

      - name: Construir portable (x86 universal + x64 opcional)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          # portable x86 (arranca en cualquier Windows 7+)
          New-Item -ItemType Directory -Force -Path portable/FusionHP-Portable | Out-Null
          Copy-Item staging/FusionHP.x86.exe       portable/FusionHP-Portable/FusionHP.exe
          Copy-Item staging/FusionShared.dll       portable/FusionHP-Portable/
          Copy-Item staging/FusionStudio.exe       portable/FusionHP-Portable/
          Copy-Item staging/FusionStudio.Lite.exe  portable/FusionHP-Portable/
          Copy-Item staging/resources              portable/FusionHP-Portable/resources -Recurse
          Set-Content portable/FusionHP-Portable/portable.flag "# Fusion HP modo portable: datos junto al programa"
          Set-Content portable/FusionHP-Portable/LEEME.txt "Fusion HP (portable): ejecuta FusionHP.exe. Los datos viven en la carpeta 'datos'."
          Compress-Archive -Path portable/FusionHP-Portable -DestinationPath dist/FusionHP-Portable-x86.zip -Force
          # portable x64
          New-Item -ItemType Directory -Force -Path portable/FusionHP-Portable-x64 | Out-Null
          Copy-Item staging/FusionHP.x64.exe       portable/FusionHP-Portable-x64/FusionHP.exe
          Copy-Item staging/FusionShared.dll       portable/FusionHP-Portable-x64/
          Copy-Item staging/FusionStudio.exe       portable/FusionHP-Portable-x64/
          Copy-Item staging/FusionStudio.Lite.exe  portable/FusionHP-Portable-x64/
          Copy-Item staging/resources              portable/FusionHP-Portable-x64/resources -Recurse
          Set-Content portable/FusionHP-Portable-x64/portable.flag "# Fusion HP modo portable"
          Set-Content portable/FusionHP-Portable-x64/LEEME.txt "Fusion HP (portable x64): ejecuta FusionHP.exe."
          Compress-Archive -Path portable/FusionHP-Portable-x64 -DestinationPath dist/FusionHP-Portable-x64.zip -Force

      - name: Checksums SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $h.Hash, $_.Name
          } | Out-File dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Subir instalador y portable
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/installer/*.exe
            dist/FusionHP-Portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # ---------------------------------------------------------------- release en tags
  release:
    name: Release (solo en tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [instalador]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Crear release con artefactos
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
