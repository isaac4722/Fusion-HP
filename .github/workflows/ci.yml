# ============================================================================
#  LuminaPresentation / LuminaPresentation Suite — CI/CD híbrido v5.0.0 «SINERGIA»
#  Copyright (c) 2026 Isaac. Licencia View-Only.
# ----------------------------------------------------------------------------
#  Pipeline de la arquitectura híbrida (docs/architecture-hybrid.md §6):
#
#    native-windows : núcleo C++ (LuminaCore.dll /MT) x86+x64 + selftest + PoC nativo
#    native-linux   : port del núcleo (GCC) — regresa rápido el estado del port
#    managed        : capa C# (net35+net48+net8 en Core) + tests + GATE exportadores
#    interop        : PoC real C# ↔ DLL nativa (x86/x64, net48; net35 informativo)
#    clrhost-poc    : vía C — CLR hosting C++ puro contra PocFacade (INFORMATIVO)
#                     (evaluación de la vía de respaldo; NO bloquea paquete/release)
#    package        : layout portable por arquitectura + verify_portable + zip + SHA256
#    release        : GitHub Release solo en tags v*
#
#  CONTRATOS de rutas entre jobs (respetar al mover proyectos):
#    managed/Lumina.sln                          (solución gestionada)
#    managed/Lumina.Core                         (net35;net48;net8.0)
#    managed/Lumina.UI                           (WinExe net35;net48)
#    managed/PoC/PoC.Managed                       (net35;net48)
#    managed/PoC/PocFacade                         (net48;net35) — COM-visible
#    managed/Tests                                 (net8.0;net48)
#    Salidas: <proj>/bin/Release/<tfm>/... (SDK-style estándar de dotnet build)
#    PoC.Managed debe imprimir "POC PASS 12/12" y salir 0 cuando todo pasa.
#    Tests debe imprimir "TESTS PASS n/n" y (v5.0.0) con LUMINA_EXPORT_SAMPLES
#    escribe muestra.pptx/muestra.pdf para el gate tools/validate_pptx.py
#    (python-pptx + pypdf: validación EXTERNA de los exportadores).
#    PocFacade: tipo por defecto "Lumina.PocFacade.PocFacade" (COMVisible,
#    MarshalByRefObject/Serializable para cruzar dominios) con métodos
#    Add(int,int), Echo(string), Version() -> prefijo "LUMINA-FACADE-OK".
# ============================================================================

name: CI híbrido

on:
  push:
    branches: [main]
    tags: ['v*']        # necesario para que el job «release» sea alcanzable
  pull_request:
  workflow_dispatch:

# Los jobs normales solo leen; la escritura (release) se concede en su job.
permissions:
  contents: read

# Un solo CI activo por rama/PR: cancela el run anterior en progreso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  APP_VERSION: '5.4.0-beta.1'

jobs:
  # ---------------------------------------------------------------------------
  # 1) Núcleo C++ en Windows: LuminaCore.dll (/MT) + selftest + PoC nativo
  # ---------------------------------------------------------------------------
  native-windows:
    name: Núcleo C++ ${{ matrix.arch }} (/MT + gates)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar (CMake ${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recolectar binarios en dist/${{ matrix.arch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.arch }}" | Out-Null
          Copy-Item build/native/Release/LuminaCore.dll        "dist/${{ matrix.arch }}/"
          Copy-Item build/native/Release/lumina_selftest.exe   "dist/${{ matrix.arch }}/"
          Copy-Item build/native/Release/lumina_poc_native.exe "dist/${{ matrix.arch }}/"

      # v5.2.0 «MOTOR»: gate de compatibilidad Win7 SP1 — ninguna API Win8+
      # (GetSystemTimePreciseAsFileTime, WaitOnAddress, PathCch*…) puede entrar
      # como import ESTÁTICO en el binario que se distribuye: en Win7 SP1,
      # LoadLibrary falla con ERROR_PROCEDURE_NOT_FOUND y la app abre en
      # «modo limitado» («carga la GUI pero más nada»). Este gate reproduce
      # esa condición ANTES de publicar (lección del bug de campo v5.1.1).
      - name: GATE Win7 SP1 — tabla de importaciones de LuminaCore.dll
        shell: pwsh
        run: |
          python tools/verify_win7_imports.py "dist/${{ matrix.arch }}/LuminaCore.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE lumina_selftest (exit 0)
        shell: pwsh
        working-directory: dist/${{ matrix.arch }}
        run: |
          ./lumina_selftest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE lumina_poc_native headless (exit 0)
        shell: pwsh
        working-directory: dist/${{ matrix.arch }}
        run: |
          ./lumina_poc_native.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir artefacto native-${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) Núcleo C++ en Linux (partes portables): señal rápida del port
  # ---------------------------------------------------------------------------
  native-linux:
    name: Núcleo C++ Linux (port)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --parallel

      - name: GATE lumina_selftest (exit 0)
        run: ./build/native/lumina_selftest

  # ---------------------------------------------------------------------------
  # 3) Capa gestionada: solución C# (net35+net48) + tests net8.0
  # ---------------------------------------------------------------------------
  managed:
    name: Capa C# (net35+net48) + tests net8.0
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Compilar solución (net35+net48 con ref assemblies)
        shell: pwsh
        run: |
          dotnet build managed/Lumina.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests net8.0 (arnés propio; LUMINA_SKIP_NATIVE=1 + muestras)
        shell: pwsh
        env:
          LUMINA_SKIP_NATIVE: '1'
          LUMINA_EXPORT_SAMPLES: 'export-samples'
        run: |
          dotnet run --project managed/Tests --configuration Release --framework net8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'GATE exportadores: python-pptx + pypdf (PPTX/PDF válidos)'
        shell: pwsh
        run: |
          pip install --quiet python-pptx pypdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_pptx.py export-samples/muestra.pptx export-samples/muestra.pdf
          if ($LASTEXITCODE -ne 0) { Write-Host 'Los exportadores no produjeron archivos válidos'; exit 1 }

      - name: Publicar UI WPF net48 + WinForms net35 POR ARQUITECTURA (x86 y x64)
        shell: pwsh
        run: |
          # LECCIÓN v5.1.0 (hallada por el gate de humo): el PRIMER publish
          # tras `dotnet build Lumina.sln` reusa el PE AnyCPU de la solución
          # (el checkpoint no trackea PlatformTarget) → el exe «x86» corría
          # como 64 bits y moría con BadImageFormatException contra
          # LuminaCore.dll x86. Fix: `dotnet clean` ANTES DE CADA publish +
          # aserción dura del bitness del PE (32BITREQUIRED para x86;
          # PE32+ 0x8664 para x64).
          function Assert-PeBitness([string]$exe, [string]$arch) {
            $b = [System.IO.File]::ReadAllBytes($exe)
            $peOff = [BitConverter]::ToInt32($b, 0x3C)
            if ($b[$peOff] -ne 0x50 -or $b[$peOff+1] -ne 0x45) {
              throw "sin cabecera PE en $exe"
            }
            $machine = [BitConverter]::ToUInt16($b, $peOff + 4)
            if ($arch -eq 'x64') {
              if ($machine -ne 0x8664) { throw ("PE no es x64 (machine=0x{0:X4}): {1}" -f $machine, $exe) }
              Write-Host "  [pe] $exe → x64 (PE32+) OK"
            } else {
              if ($machine -ne 0x014C) { throw ("PE no es x86 (machine=0x{0:X4}): {1}" -f $machine, $exe) }
              # PE32: distinguir x86 REAL de AnyCPU por el flag 32BITREQUIRED
              # del header COR20 (directorio 14): machine igual (0x14C).
              $optOff = $peOff + 24
              $magic = [BitConverter]::ToUInt16($b, $optOff)
              $ddOff = if ($magic -eq 0x10B) { $optOff + 96 } else { $optOff + 112 }
              $corRva = [BitConverter]::ToInt32($b, $ddOff + 14*8)
              $corOff = 0
              if ($corRva -gt 0) {
                $nsec = [BitConverter]::ToUInt16($b, $peOff + 6)
                $optSize = [BitConverter]::ToUInt16($b, $peOff + 20)
                $secOff = $optOff + $optSize
                for ($i = 0; $i -lt $nsec; $i++) {
                  $s = $secOff + 40*$i
                  $vaddr = [BitConverter]::ToUInt32($b, $s + 12)
                  $vsize = [BitConverter]::ToUInt32($b, $s + 8)
                  if ($corRva -ge $vaddr -and $corRva -lt ($vaddr + [Math]::Max($vsize, 0x1000))) {
                    $corOff = [BitConverter]::ToUInt32($b, $s + 20) + ($corRva - $vaddr); break
                  }
                }
              }
              if ($corOff -eq 0) { throw "sin header COR20 en $exe (¿nativo?)" }
              $flags = [BitConverter]::ToUInt32($b, $corOff + 16)
              if (($flags -band 0x2) -eq 0) {
                throw ("AnyCPU detectado (sin 32BITREQUIRED, flags=0x{0:X8}): {1}" -f $flags, $exe)
              }
              Write-Host "  [pe] $exe → x86 (32BITREQUIRED) OK"
            }
          }

          # Compilar con el PlatformTarget pedido y COPIAR el bin directamente:
          # el publish de un exe .NET Framework solo copia archivos, y el SDK 10
          # del runner deriva RuntimeIdentifier del PlatformTarget (NETSDK1047).
          # El bin del build YA trae exe + .exe.config + DLLs dependientes.
          function Publish-Ui([string]$tfm, [string]$platform, [string]$destName) {
            dotnet clean managed/Lumina.UI -f $tfm -c Release | Out-Null
            dotnet build managed/Lumina.UI -f $tfm -c Release -p:PlatformTarget=$platform
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $bin = "managed/Lumina.UI/bin/Release/$tfm"
            $exe = Get-ChildItem "$bin/*.exe" | Select-Object -First 1
            Assert-PeBitness $exe.FullName $platform
            New-Item -ItemType Directory -Force -Path "$bin/$destName" | Out-Null
            Copy-Item "$bin/*.exe" "$bin/$destName/" -ErrorAction Stop
            Copy-Item "$bin/*.dll" "$bin/$destName/" -ErrorAction Stop
            Copy-Item "$bin/*.exe.config" "$bin/$destName/" -ErrorAction Stop
            Write-Host "  [publish] $destName listo con $((Get-ChildItem "$bin/$destName").Count) archivos"
          }

          # v5.4.0 «ESTUDIO»: la variante net48 del paquete es la interfaz WPF
          # (LuminaPresentation.exe). Mismas lecciones v5.1.0: clean ANTES DE
          # cada publish + aserción dura del bitness del PE.
          function Publish-Wpf([string]$platform, [string]$destName) {
            dotnet clean managed/Lumina.WPF -f net48 -c Release | Out-Null
            dotnet build managed/Lumina.WPF -f net48 -c Release -p:PlatformTarget=$platform
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $bin = "managed/Lumina.WPF/bin/Release/net48"
            $exe = Get-ChildItem "$bin/*.exe" | Select-Object -First 1
            Assert-PeBitness $exe.FullName $platform
            New-Item -ItemType Directory -Force -Path "$bin/$destName" | Out-Null
            Copy-Item "$bin/*.exe" "$bin/$destName/" -ErrorAction Stop
            Copy-Item "$bin/*.dll" "$bin/$destName/" -ErrorAction Stop
            Copy-Item "$bin/*.exe.config" "$bin/$destName/" -ErrorAction Stop
            Write-Host "  [publish] $destName listo con $((Get-ChildItem "$bin/$destName").Count) archivos"
          }

          Publish-Wpf 'x86' 'publish-x86'
          Publish-Wpf 'x64' 'publish-x64'
          Publish-Ui 'net35' 'x86' 'publish35-x86'
          Publish-Ui 'net35' 'x64' 'publish35-x64'

      - name: Preparar artefacto «managed»
        shell: pwsh
        run: |
          $stage = 'artifacts-managed'
          New-Item -ItemType Directory -Force -Path `
            "$stage/ui-publish-x86","$stage/ui-publish-x64","$stage/ui-publish35-x86","$stage/ui-publish35-x64",`
            "$stage/poc-net48","$stage/poc-net35",`
            "$stage/pocfacade-net48","$stage/tests-net48" | Out-Null
          # UI net48/net35 publicada POR ARQUITECTURA (para el paquete portable).
          # v5.1.0: el publish lleva TODAS las DLL gestionadas dependientes
          # (Lumina.Core/Bridge/Api) — el paquete las copia COMPLETAS.
          Copy-Item managed/Lumina.UI/bin/Release/net48/publish-x86/* "$stage/ui-publish-x86/"
          Copy-Item managed/Lumina.UI/bin/Release/net48/publish-x64/* "$stage/ui-publish-x64/"
          Copy-Item managed/Lumina.UI/bin/Release/net35/publish35-x86/* "$stage/ui-publish35-x86/"
          Copy-Item managed/Lumina.UI/bin/Release/net35/publish35-x64/* "$stage/ui-publish35-x64/"
          # Respaldo: si un publish dejó el exe en otra carpeta, copiar del build
          if (-not (Test-Path "$stage/ui-publish-x86/LuminaPresentation.exe")) {
            Copy-Item managed/Lumina.UI/bin/Release/net48/LuminaPresentation.exe "$stage/ui-publish-x86/"
          }
          if (-not (Test-Path "$stage/ui-publish-x64/LuminaPresentation.exe")) {
            Copy-Item managed/Lumina.UI/bin/Release/net48/LuminaPresentation.exe "$stage/ui-publish-x64/"
          }
          # PoC.Managed (binarios net48 y net35)
          Copy-Item managed/PoC/PoC.Managed/bin/Release/net48/* "$stage/poc-net48/"
          Copy-Item managed/PoC/PoC.Managed/bin/Release/net35/* "$stage/poc-net35/"
          # Facade COM-visible (para el PoC de CLR hosting)
          Copy-Item managed/PoC/PocFacade/bin/Release/net48/Lumina.PocFacade.dll "$stage/pocfacade-net48/"
          # Tests net48 (informativo)
          Copy-Item managed/Tests/bin/Release/net48/* "$stage/tests-net48/"

      - name: Subir artefacto managed
        uses: actions/upload-artifact@v4
        with:
          name: managed
          path: artifacts-managed
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4) Interop real: PoC C# (net48) contra LuminaCore.dll por arquitectura
  # ---------------------------------------------------------------------------
  interop:
    name: Interop C# ↔ nativo (${{ matrix.arch }})
    needs: [native-windows, managed]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # dotnet build -f net48 produce un .exe que corre sobre .NET Framework 4.8
      # (preinstalado en windows-latest). Para x86 se fuerza PlatformTarget=x86
      # y el exe corre bajo WoW64; así el proceso casa con LuminaCore.dll.
      - name: Compilar PoC.Managed net48 (${{ matrix.arch }})
        shell: pwsh
        run: |
          dotnet build managed/PoC/PoC.Managed -f net48 -c Release -p:PlatformTarget=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Colocar LuminaCore.dll (${{ matrix.arch }}) junto al PoC
        shell: pwsh
        run: |
          Copy-Item "artifacts/native-${{ matrix.arch }}/LuminaCore.dll" `
                    "managed/PoC/PoC.Managed/bin/Release/net48/"

      - name: 'GATE PoC net48 ${{ matrix.arch }}: «POC PASS 12/12» + exit 0'
        shell: pwsh
        working-directory: managed/PoC/PoC.Managed/bin/Release/net48
        run: |
          $out = & ./PoC.Managed.exe 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "$_" }
          if ($code -ne 0) { Write-Host "EXIT CODE: $code"; exit 1 }
          if (-not ($out -match 'POC PASS 12/12')) {
            Write-Host 'No apareció "POC PASS 12/12" en la salida'; exit 1
          }

      # Informativo: SOLO si el runtime 3.5 está disponible en el runner
      # (windows-latest no siempre lo trae). Nunca rompe el CI.
      - name: 'PoC net35 (informativo, continue-on-error)'
        continue-on-error: true
        shell: pwsh
        run: |
          $v35 = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5' -ErrorAction SilentlyContinue
          if (-not $v35 -or $v35.Install -ne 1) {
            Write-Host 'Runtime 3.5 no disponible en el runner: paso omitido (informativo).'
            exit 0
          }
          dotnet build managed/PoC/PoC.Managed -f net35 -c Release -p:PlatformTarget=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "artifacts/native-${{ matrix.arch }}/LuminaCore.dll" `
                    "managed/PoC/PoC.Managed/bin/Release/net35/"
          Set-Location managed/PoC/PoC.Managed/bin/Release/net35
          $out = & ./PoC.Managed.exe 2>&1
          $out | ForEach-Object { Write-Host "$_" }
          Write-Host "EXIT CODE (informativo): $LASTEXITCODE"

  # ---------------------------------------------------------------------------
  # 5) Vía C: CLR hosting desde C++ puro contra PocFacade (x86 y x64)
  # ---------------------------------------------------------------------------
  clrhost-poc:
    name: CLR hosting C++ (${{ matrix.arch }}, informativo)
    needs: [native-windows, managed]
    # Vía C = evaluación de respaldo (docs/architecture-hybrid.md §3). El gate
    # estricto de interop es el del PoC de la vía A (elegida). Este job queda
    # informativo: si la activación del CLR falla por el entorno del runner
    # (p. ej. shim sin runtime registrado), NO bloquea paquete/release.
    continue-on-error: true
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # CMakeLists autónomo con /MT (no toca la base del núcleo).
      - name: Compilar lumina_poc_clrhost (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake -S native/poc-clrhost -B bch -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build bch --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar PocFacade net48
        shell: pwsh
        run: |
          dotnet build managed/PoC/PocFacade -f net48 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar carpeta de ejecución
        shell: pwsh
        run: |
          Copy-Item managed/PoC/PocFacade/bin/Release/net48/Lumina.PocFacade.dll bch/Release/
          Copy-Item "artifacts/native-${{ matrix.arch }}/LuminaCore.dll" bch/Release/

      - name: 'GATE CLRHOST (${{ matrix.arch }}): «CLRHOST PASS» + exit 0'
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'bch/Release/Lumina.PocFacade.dll').Path
          $out = & ./bch/Release/lumina_poc_clrhost.exe $dll 'lumina.poc.LuminaFacade' 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "$_" }
          if ($code -ne 0) { Write-Host "EXIT CODE: $code"; exit 1 }
          if (-not ($out -match 'CLRHOST PASS')) {
            Write-Host 'No apareció "CLRHOST PASS" en la salida'; exit 1
          }

  # ---------------------------------------------------------------------------
  # 6) Empaquetado portable por arquitectura + gate de verificación
  # ---------------------------------------------------------------------------
  package:
    name: Empaquetado portable (${{ matrix.arch }})
    needs: [interop]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Launcher nativo con su CMakeLists autónomo (mismo patrón que clrhost).
      - name: Compilar LuminaLauncher (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake -S native/launcher -B blaunch -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build blaunch --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Armar layout portable v5.3.0 (net48 + net35 + raíz compartida)'
        shell: pwsh
        run: |
          $stage = "staging/LuminaPresentation-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path `
            "$stage/net48","$stage/net35","$stage/resources/data" | Out-Null

          # ---- Launcher en la RAÍZ (elige la variante según el CLR del equipo) ----
          Copy-Item blaunch/Release/LuminaLauncher.exe "$stage/"

          # ---- net48\: interfaz optimizada + TODAS sus DLL gestionadas ----
          Copy-Item "artifacts/managed/ui-publish-${{ matrix.arch }}/*" "$stage/net48/"
          # LuminaCore.dll (nativa /MT) junto al exe: la resolución del loader
          # busca primero el directorio del proceso.
          Copy-Item "artifacts/native-${{ matrix.arch }}/LuminaCore.dll" "$stage/net48/"

          # ---- net35\: baseline mínima (.NET 3.5, Win7 SP1 de fábrica) ----
          Copy-Item "artifacts/managed/ui-publish35-${{ matrix.arch }}/*" "$stage/net35/"
          Copy-Item "artifacts/native-${{ matrix.arch }}/LuminaCore.dll" "$stage/net35/"

          # ---- Recursos de fábrica (Biblia RVR1909 completa) ----
          Copy-Item resources/data/bible_rvr1909.json "$stage/resources/data/"

          # ---- data\ compartida en la RAÍZ: Settings.DefaultBaseDir() detecta el
          #      layout net48/net35 y sube un nivel → una sola carpeta de datos.
          New-Item -ItemType Directory -Force -Path "$stage/data" | Out-Null

          @'
          LuminaPresentation v5.4.0 «ESTUDIO» BETA — núcleo C++ + interfaz WPF
          =====================================================

          PROGRAMA PORTABLE — BETA. No requiere instalación ni permisos de
          administrador.

          1) Descomprimir el ZIP COMPLETO en cualquier carpeta propia.
          2) Ejecutar LuminaLauncher.exe.

          Requisitos (cualquiera de los dos, según su Windows):
            • Windows 10 1903+ / Windows 11 → .NET Framework 4.8 integrado
              (el launcher usa la variante net48, con interfaz WPF y OBS
              WebSocket).
            • Windows 7 SP1 / 8.x → .NET Framework 3.5 integrado
              (el launcher usa la variante net35, la baseline mínima).

          Ambas variantes están incluidas (net48\ y net35\) y comparten
          la misma carpeta de datos (data\) — canciones, biblias, temas,
          activadores y ajustes.

          NO ejecute desde dentro del ZIP: extráigalo primero completo.

          Contenido:
            LuminaLauncher.exe  — detecta el runtime .NET y lanza la variante
                                  correcta; verifica el paquete completo antes.
            net48\              — interfaz WPF optimizada (.NET 4.8).
            net35\              — interfaz WinForms baseline (.NET 3.5, Win7 SP1).
            LuminaCore.dll      — motor C++ nativo (/MT, sin dependencias),
                                  dentro de cada carpeta de variante.
            resources\data\     — Biblia Reina-Valera 1909 completa incluida:
                                  al abrir la base de datos, la app ofrece
                                  instalarla (~31.000 versículos).

          v5.4.0 «ESTUDIO» (BETA): la interfaz principal pasa a WPF (Windows
          Presentation Foundation) sobre .NET Framework 4.8 — mismo motor
          probado de v5.2.0+ y mismos gates de CI. Diseño «Lumina Studio»
          rehecho en XAML: tokens semánticos de color, 94 iconos vectoriales
          Feather (MIT), tarjetas redondeadas, botones con variantes y estados,
          navegación lateral con píldora ámbar, vista previa del tema con
          contorno por silueta (misma técnica del núcleo), foco visible por
          teclado y tooltips con atajos. La baseline net35 (WinForms) se
          conserva para Windows 7 SP1 sin .NET 4.8. ESTA VERSIÓN ES BETA.

          v5.3.0 «INTERFAZ»: rediseño completo de la UI/UX de la variante
          WinForms (tema «Lumina Studio», sistema de diseño UiKit, página
          «En Vivo» rehecha, atajos F1/Ctrl+1…9).

          v5.2.0 «MOTOR»: corregido el fallo que dejaba la app «con la GUI
          pero más nada» en Windows 7 SP1 (reporte de campo): el CRT/STL
          estático arrastraba un import de una API que NO existe en Win7
          (GetSystemTimePreciseAsFileTime, de Win8+) → LuminaCore.dll no
          cargaba → la app abría en modo limitado y «Cargar al escenario»
          lanzaba NullReferenceException. Ahora esa API se resuelve con
          delay-load + fallback seguro, la CI audita la tabla de
          importaciones de cada binario (gate Win7) y ejercita el flujo
          Biblia→Escenario completo (gate --flowcheck) antes de publicar.

          v5.1.1 «APERTURA»: corregido el error que impedía ABRIR la app en
          algunos equipos («Control does not support transparent background
          colors»: el control Chip de la cabecera usaba fondo transparente sin
          activar el estilo WinForms que lo permite). La CI ahora construye la
          ventana completa de ambas variantes antes de publicar el paquete.

          v5.1.0 «FUNDAMENTO»: reparación del arranque (paquete completo),
          .NET mínimo 3.5 con 4.8 opcional, teclado en vivo (flechas/espacio/
          B/L/P/F5-F8), acordes proyectables, búsqueda bíblica por palabra,
          tercera pantalla del director, editor de culto completo (canción/
          pasaje/imagen/texto/plan JSON), video con bucle/volumen/pausa,
          pantallas reales del sistema, respaldo ZIP a carpeta (Google Drive/
          OneDrive) y biblia de fábrica.

          Binarios de uso libre · Código fuente bajo Licencia View-Only.
          '@ | Set-Content -Path "$stage/README.txt" -Encoding UTF8

      - name: 'GATE humo: --selfcheck + --uicheck + --flowcheck de AMBAS variantes (la app ABRE, la ventana SE CONSTRUYE y los FLUJOS responden)'
        shell: pwsh
        run: |
          # Este gate existe por tres lecciones de campo:
          #   v5.0.0 — el paquete se publicó sin las DLL gestionadas y la app
          #            moría con FileNotFoundException AL ABRIR → --selfcheck.
          #   v5.1.0 — el control Chip asignaba BackColor=Transparent sin
          #            SupportsTransparentBackColor: ArgumentException en
          #            MainForm..ctor, la app NO ABRÍA… y el --selfcheck (sin
          #            UI) pasaba en verde → --uicheck (v5.1.1).
          #   v5.1.1 — el núcleo no cargaba en Win7 SP1 (import estático
          #            Win8+ en el CRT): la app abría en modo limitado y
          #            «Cargar al escenario» lanzaba NullReferenceException
          #            → --flowcheck (v5.2.0): flujos reales headless.
          # Ahora el MISMO binario que se va a empaquetar se auto-verifica:
          # motor + BD + exportadores (selfcheck), construcción de la ventana
          # (uicheck) Y los flujos de usuario (flowcheck).
          $stage = "staging/LuminaPresentation-${{ matrix.arch }}"

          # Función de diagnóstico: vuelca el log de sesión del selfcheck al
          # log del runner (el exe es WinExe: su salida no aparece sin esto).
          function DumpSelfcheckLog([string]$root, [string]$variant) {
            $logDir = Join-Path $root 'data/logs'
            if (Test-Path $logDir) {
              $last = Get-ChildItem $logDir -Filter '*.log' |
                      Sort-Object LastWriteTime | Select-Object -Last 1
              if ($last) {
                Write-Host "===== data\logs\$($last.Name) ($variant) ====="
                Get-Content $last.FullName | ForEach-Object { Write-Host "  $_" }
                Write-Host '===== fin del log de sesión ====='
              }
            } else {
              Write-Host "(sin data\logs\ para $variant — el proceso murió antes de escribir el log)"
            }
          }

          # .NET 3.5 real para la baseline (para probar sobre CLR2). Si el
          # runner no puede instalarlo, el humo net35 bajo CLR4 es INFORMATIVO:
          # una BD real de usuario con solo-4.8 siempre usará la variante net48
          # (el launcher la elige), y Win7 SP1 trae 3.5 de fábrica. El caso
          # «3.5 instalado + selfcheck falla» SÍ es bloqueante (fallo real).
          $v35 = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5' -ErrorAction SilentlyContinue
          $has35 = $v35 -and $v35.Install -eq 1
          if (-not $has35) {
            Write-Host 'Instalando .NET 3.5 (NetFx3) para el humo de la baseline…'
            try {
              Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -ErrorAction Stop | Out-Null
              $v35 = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5' -ErrorAction SilentlyContinue
              $has35 = $v35 -and $v35.Install -eq 1
              if ($has35) { Write-Host '.NET 3.5 instalado: el humo net35 correrá sobre CLR2 real.' }
            } catch {
              Write-Host "NetFx3 no instalable en el runner ($($_.Exception.Message))."
            }
          }

          Write-Host '--- selfcheck net48 (bloqueante) ---'
          $p48 = Start-Process -FilePath "$stage/net48/LuminaPresentation.exe" `
                 -ArgumentList '--selfcheck' -WorkingDirectory "$stage" -PassThru -Wait
          Write-Host "net48 --selfcheck exit code: $($p48.ExitCode)"
          if ($p48.ExitCode -ne 0) {
            DumpSelfcheckLog $stage 'net48'
            Write-Host "::error::La variante net48 no pasó el selfcheck (código $($p48.ExitCode))"
            exit 1
          }

          Write-Host '--- selfcheck net35 ---'
          $p35 = Start-Process -FilePath "$stage/net35/LuminaPresentation35.exe" `
                 -ArgumentList '--selfcheck' -WorkingDirectory "$stage" -PassThru -Wait
          Write-Host "net35 --selfcheck exit code: $($p35.ExitCode)"
          if ($p35.ExitCode -ne 0) {
            DumpSelfcheckLog $stage 'net35'
            if ($has35) {
              Write-Host "::error::La variante net35 FALLÓ con .NET 3.5 presente (código $($p35.ExitCode))"
              exit 1
            } else {
              # Entorno del runner sin 3.5: la baseline no puede cargar sus
              # dependencias 3.x bajo CLR4 (WindowsBase 3.0). Caso no soportado
              # de fábrica: un PC real así usa la variante net48 vía launcher.
              Write-Host "::warning::net35 selfcheck no ejecutable en este runner (sin .NET 3.5): código $($p35.ExitCode). La cobertura CLR2 real se da en PCs Win7 SP1 (3.5 de fábrica)."
            }
          }

          # ---- v5.1.1: gate de UI — la ventana principal SE CONSTRUYE -------
          # Reproduce la traza exacta del crash de v5.1.0 (MainForm..ctor →
          # BuildHeader → Chip..ctor). Headless: construye, no muestra.
          Write-Host '--- uicheck net48 (bloqueante): la ventana SE CONSTRUYE ---'
          $p48ui = Start-Process -FilePath "$stage/net48/LuminaPresentation.exe" `
                   -ArgumentList '--uicheck' -WorkingDirectory "$stage" -PassThru -Wait
          Write-Host "net48 --uicheck exit code: $($p48ui.ExitCode)"
          if ($p48ui.ExitCode -ne 0) {
            DumpSelfcheckLog $stage 'net48 uicheck'
            Write-Host "::error::La variante net48 no pasó el uicheck (código $($p48ui.ExitCode)) — la ventana principal no se puede construir; la app no abriría"
            exit 1
          }

          Write-Host '--- uicheck net35 ---'
          $p35ui = Start-Process -FilePath "$stage/net35/LuminaPresentation35.exe" `
                   -ArgumentList '--uicheck' -WorkingDirectory "$stage" -PassThru -Wait
          Write-Host "net35 --uicheck exit code: $($p35ui.ExitCode)"
          if ($p35ui.ExitCode -ne 0) {
            DumpSelfcheckLog $stage 'net35 uicheck'
            if ($has35) {
              Write-Host "::error::La variante net35 FALLÓ el uicheck con .NET 3.5 presente (código $($p35ui.ExitCode))"
              exit 1
            } else {
              Write-Host "::warning::net35 uicheck no ejecutable en este runner (sin .NET 3.5): código $($p35ui.ExitCode)."
            }
          }

          # ---- v5.2.0: gate de FLUJOS — Biblia→Escenario, sin excepciones ----
          # (1) con el núcleo caído (modo limitado simulado): debe avisar,
          #     JAMÁS lanzar (el bug de campo v5.1.1);
          # (2) flujo feliz completo: BD temporal → pasaje → slides.
          Write-Host '--- flowcheck net48 (bloqueante): los FLUJOS responden ---'
          $p48f = Start-Process -FilePath "$stage/net48/LuminaPresentation.exe" `
                  -ArgumentList '--flowcheck' -WorkingDirectory "$stage" -PassThru -Wait
          Write-Host "net48 --flowcheck exit code: $($p48f.ExitCode)"
          if ($p48f.ExitCode -ne 0) {
            DumpSelfcheckLog $stage 'net48 flowcheck'
            Write-Host "::error::La variante net48 no pasó el flowcheck (código $($p48f.ExitCode)) — un flujo de usuario lanza excepción"
            exit 1
          }

          Write-Host '--- flowcheck net35 ---'
          $p35f = Start-Process -FilePath "$stage/net35/LuminaPresentation35.exe" `
                  -ArgumentList '--flowcheck' -WorkingDirectory "$stage" -PassThru -Wait
          Write-Host "net35 --flowcheck exit code: $($p35f.ExitCode)"
          if ($p35f.ExitCode -ne 0) {
            DumpSelfcheckLog $stage 'net35 flowcheck'
            if ($has35) {
              Write-Host "::error::La variante net35 FALLÓ el flowcheck con .NET 3.5 presente (código $($p35f.ExitCode))"
              exit 1
            } else {
              Write-Host "::warning::net35 flowcheck no ejecutable en este runner (sin .NET 3.5): código $($p35f.ExitCode)."
            }
          }

          # Los checks pudieron crear data\logs\ en el staging: limpiar para que
          # el ZIP distribuido no lleve basura de la fábrica.
          Remove-Item "$stage/data/logs" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'SELFCHECK+UICHECK+FLOWCHECK PASS (net48 estricto + net35 según entorno)'

      - name: GATE verify_portable (${{ matrix.arch }})
        shell: pwsh
        run: |
          python tools/verify_portable.py "staging/LuminaPresentation-${{ matrix.arch }}" ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # v5.2.0: el gate Win7 también corre sobre el PAQUETE armado (la DLL
      # que viajará en el ZIP) y sobre el launcher — doble verificación.
      - name: GATE Win7 SP1 — imports del PAQUETE armado
        shell: pwsh
        run: |
          python tools/verify_win7_imports.py `
            "staging/LuminaPresentation-${{ matrix.arch }}/net48/LuminaCore.dll" `
            "staging/LuminaPresentation-${{ matrix.arch }}/net35/LuminaCore.dll" `
            "staging/LuminaPresentation-${{ matrix.arch }}/LuminaLauncher.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ZIP + SHA256
        shell: pwsh
        run: |
          $zip = "LuminaPresentation-${{ env.APP_VERSION }}-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path "staging/LuminaPresentation-${{ matrix.arch }}/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content -Path SHA256SUMS.txt -Encoding ASCII
          Write-Host "$hash  $zip"

      - name: Subir artefacto portable-${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}
          path: |
            LuminaPresentation-*.zip
            SHA256SUMS.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 7) BETA: solo en tags v* (v5.4.0: TODO lo publicado es BETA / pre-release)
  # ---------------------------------------------------------------------------
  release:
    name: Publicar BETA (tags v*)
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # crear la release y subir assets
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: SHA256SUMS combinado
        run: |
          cd artifacts
          find . -name '*.zip' -print0 | sort -z | xargs -0 sha256sum | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar BETA
        uses: softprops/action-gh-release@v2
        with:
          name: "LuminaPresentation ${{ github.ref_name }} «ESTUDIO» — BETA"
          body: |
            **LuminaPresentation v5.4.0-beta.1 «ESTUDIO» — BETA · núcleo C++ + interfaz WPF (.NET 4.8) + baseline WinForms (.NET 3.5)**

            > ⚠ **ESTA PUBLICACIÓN ES UNA BETA** (pre-release de evaluación):
            > funcionalidad completa y gates de CI en verde, pero sujeta a
            > cambios. Reporte de fallos bienvenido.

            ## Descargas
            - `LuminaPresentation-5.4.0-beta.1-win-x86.zip` — **Windows 7 SP1 a Windows 11 (32 bits)**
            - `LuminaPresentation-5.4.0-beta.1-win-x64.zip` — **Windows 7 SP1 a Windows 11+ (64 bits)**
            - `SHA256SUMS.txt` — integridad de los paquetes

            ## ✨ v5.4.0 «ESTUDIO» — La GUI pasa a WPF (Windows Presentation Foundation)
            La interfaz principal del paquete (net48) se reescribió en **WPF
            sobre .NET Framework 4.8** (integrado en Win10 1903+/Win11;
            instalable en Win7 SP1/8.x). Misma arquitectura híbrida probada
            (núcleo C++17 /MT), mismas funciones y MISMOS GATES de CI:
            - **Diseño «Lumina Studio» en XAML**: tokens semánticos de color,
              tarjetas redondeadas, botones con variantes (primary/secondary/
              danger/ghost) y estados (hover/pulsado/foco/deshabilitado/toggle),
              navegación lateral con píldora ámbar y barra de estado con punto
              de severidad.
            - **94 iconos vectoriales** Feather (licencia MIT) convertidos a
              geometrías XAML — nitidez idéntica en Win7 y Win11, sin archivos
              externos.
            - **Vista previa del tema** con contorno por silueta y sombra real
              (FormattedText.BuildGeometry — la MISMA técnica del motor).
            - **UX transversal**: F1 atajos · Ctrl+1…9 páginas · foco visible
              por teclado · tooltips con atajos · estados vacíos explicativos.
            - **Baseline intacta**: la variante net35 (WinForms) se conserva
              para Windows 7 SP1 sin .NET 4.8 — mismo paquete, cero regresión.

            ## Verificación CI (todas las gates verdes ANTES de publicar)
            - Núcleo: selftest nativo + PoC API headless (x86/x64, Win y Linux).
            - Gestionado: build net35+net48+WPF (0 err/0 warn) + tests n/n.
            - GATE exportadores: python-pptx + pypdf abren los archivos generados.
            - Interop real: PoC C# ↔ DLL nativa «POC PASS 12/12» (x86/x64).
            - GATE humo: `--selfcheck` de ambas variantes (WPF y WinForms).
            - GATE UI: `--uicheck` — la ventana WPF completa se construye
              headless (XAML incluido) antes de empaquetar.
            - GATE flujos: `--flowcheck` — Biblia→Escenario completo y en modo
              limitado simulado, sin excepciones.
            - GATE Win7: `verify_win7_imports.py` — sin imports estáticos Win8+.
            - Empaquetado: `verify_portable` (layout completo) + SHA256.

            ## Instalación
            Descomprimir el ZIP **completo** en una carpeta propia y ejecutar
            `LuminaLauncher.exe`. En Win10 1903+/Win11 usa .NET 4.8 integrado
            (GUI WPF); en Win7 SP1 usa .NET 3.5 integrado (GUI WinForms).
          draft: false
          prerelease: true
          files: |
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
