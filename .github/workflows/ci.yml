# ============================================================================
#  Fusion-HP · CI [AGENT.md paso 8]: compilación dual x86+x64 obligatoria,
#  tests nativos y administrados, gate de prohibiciones, instalador Inno Setup
#  y paquete portable. En tags v*: sube artefactos de release.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # ---------------------------------------------------------------- núcleo nativo
  nucleo:
    name: Núcleo C++ (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Buscar MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild no encontrado' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compilar núcleo ${{ matrix.arch }}
        shell: pwsh
        run: |
          $platform = '${{ matrix.arch }}' -eq 'x86' ? 'Win32' : 'x64'
          & "${{ steps.msbuild.outputs.path }}" src/core/FusionHP.vcxproj /p:Configuration=Release /p:Platform=$platform /m /v:m /nologo
          if ($LASTEXITCODE -ne 0) { throw "compilación $platform falló" }
          Test-Path "dist/$platform/FusionHP.exe"

      - name: Compilar y ejecutar tests nativos ${{ matrix.arch }}
        shell: pwsh
        run: |
          $platform = '${{ matrix.arch }}' -eq 'x86' ? 'Win32' : 'x64'
          & "${{ steps.msbuild.outputs.path }}" tests/native/CoreTests.vcxproj /p:Configuration=Release /p:Platform=$platform /m /v:m /nologo
          if ($LASTEXITCODE -ne 0) { throw "tests $platform no compilaron" }
          $exe = "dist/tests/$platform/CoreTests.exe"
          if (-not (Test-Path $exe)) { throw "CoreTests.exe no está en $exe" }
          Copy-Item tests/fixtures -Destination dist/tests/$platform/fixtures -Recurse -Force
          Push-Location (Split-Path (Resolve-Path $exe).Path)
          try { & ".\CoreTests.exe" 2>&1 | ForEach-Object { "$_" } } finally { Pop-Location }
          $code = $LASTEXITCODE
          Write-Host "CoreTests exit code: $code"
          if ($code -ne 0) { throw "tests nativos $platform FALLAN (exit=$code)" }

      - name: Verificación Win7 (imports Win8+) y tamaño del núcleo [v4.1.0]
        shell: pwsh
        run: |
          $platform = '${{ matrix.arch }}' -eq 'x86' ? 'Win32' : 'x64'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vspath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vspath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin no encontrado" }
          # APIs solo-Win8+: su presencia rompe Win7 SP1 x86 [tabla deps v4.1.0]
          $banned = 'WaitOnAddress','WakeByAddressAll','WakeByAddressSingle','GetSystemTimePreciseAsFileTime','CreateFile2','GetOverlappedResultEx','PathCchCanonicalizeEx','PathCchCombineEx','RoInitialize','RoGetActivationFactory'
          $fail = $false
          foreach ($exe in @("dist\$platform\FusionHP.exe", "dist\tests\$platform\CoreTests.exe")) {
            $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
            Write-Host "Tamaño $exe : $size MB"
            $imports = & $dumpbin.FullName /IMPORTS $exe | Out-String
            foreach ($api in $banned) {
              if ($imports -match $api) {
                Write-Host "::error::$exe importa $api (solo Win8+)"
                $fail = $true
              }
            }
          }
          if ($fail) { throw "imports Win8+ detectados — verificación Win7 SP1 fallida" }

      - name: Subir binarios del núcleo
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch == 'x86' && 'Win32' || 'x64' }}/FusionHP.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- capa administrada
  gestionada:
    name: Capa C# (net48 + net35) + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar y compilar FusionShared (net35)
        shell: pwsh
        run: |
          dotnet restore src/managed/FusionShared/FusionShared.csproj
          dotnet build src/managed/FusionShared/FusionShared.csproj -c Release --no-restore -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionShared net35 no compiló' }

      - name: Compilar FusionStudio (net48, WinForms+WPF)
        shell: pwsh
        run: |
          dotnet build src/managed/FusionStudio/FusionStudio.csproj -c Release -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionStudio net48 no compiló' }

      - name: Compilar FusionStudio.Lite (net35, perfil B)
        shell: pwsh
        run: |
          dotnet build src/managed/FusionStudio.Lite/FusionStudio.Lite.csproj -c Release -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionStudio.Lite net35 no compiló' }

      - name: Tests administrados (net48)
        shell: pwsh
        run: |
          dotnet build tests/managed/FusionTests.csproj -c Release -v m
          if ($LASTEXITCODE -ne 0) { throw 'FusionTests no compiló' }
          & "tests/managed/bin/Release/FusionTests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'tests administrados FALLAN' }

      - name: Subir binarios administrados
        uses: actions/upload-artifact@v4
        with:
          name: gestionada
          path: |
            src/managed/FusionShared/bin/Release/FusionShared.dll
            src/managed/FusionStudio/bin/Release/FusionStudio.exe
            src/managed/FusionStudio.Lite/bin/Release/FusionStudio.Lite.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- gate de calidad
  gate:
    name: Gate de calidad (auditoría de prohibiciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditoría de prohibiciones [SPEC §3.5, §11.4]
        run: bash scripts/quality_gate.sh

  # ---------------------------------------------------------------- paquete + instalador
  instalador:
    name: Instalador dual + portable
    runs-on: windows-latest
    needs: [nucleo, gestionada, gate]
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Preparar staging (ambas arquitecturas)
        shell: pwsh
        run: |
          $root = "dist-artifacts"
          # staging DENTRO de installer/: ISCC resuelve rutas relativas contra la carpeta del .iss
          New-Item -ItemType Directory -Force -Path installer/staging | Out-Null
          # Los artefactos preservan la estructura de directorios: resolver por búsqueda recursiva
          function Find-First($dir, $name) {
            $f = Get-ChildItem -Path $dir -Recurse -Filter $name -File | Select-Object -First 1
            if (-not $f) { throw "no encontrado en el artefacto: $name" }
            return $f.FullName
          }
          # núcleo
          Copy-Item (Find-First "$root/nucleo-x86" "FusionHP.exe") installer/staging/FusionHP.x86.exe
          Copy-Item (Find-First "$root/nucleo-x64" "FusionHP.exe") installer/staging/FusionHP.x64.exe
          # administrada
          Copy-Item (Find-First "$root/gestionada" "FusionShared.dll")      installer/staging/
          Copy-Item (Find-First "$root/gestionada" "FusionStudio.exe")     installer/staging/
          Copy-Item (Find-First "$root/gestionada" "FusionStudio.Lite.exe") installer/staging/

          # terceros (v4.1.0): DLL junto al exe + interop SQLite por arquitectura
          $tp = "third_party/net"
          Copy-Item "$tp/Newtonsoft.Json/13.0.3/Newtonsoft.Json.dll"                      installer/staging/
          Copy-Item "$tp/NLog/4.7.15/NLog.dll"                                            installer/staging/
          Copy-Item "$tp/PdfSharp/1.50.5147/PdfSharp.dll"                                 installer/staging/
          Copy-Item "$tp/PdfSharp/6.1.1/PdfSharp.dll"                                     installer/staging/
          Copy-Item "$tp/PdfSharp/6.1.1/PdfSharp.System.dll"                              installer/staging/
          Copy-Item "$tp/Microsoft.Extensions.Logging.Abstractions/6.0.0/Microsoft.Extensions.Logging.Abstractions.dll" installer/staging/
          Copy-Item "$tp/System.Data.SQLite/1.0.118/System.Data.SQLite.dll"               installer/staging/
          Copy-Item "$tp/DocumentFormat.OpenXml/2.7.2/DocumentFormat.OpenXml.dll"         installer/staging/
          Copy-Item "$tp/Ookii.Dialogs/1.0.0/Ookii.Dialogs.Wpf.dll"                       installer/staging/
          New-Item -ItemType Directory -Force -Path installer/staging/x86 | Out-Null
          New-Item -ItemType Directory -Force -Path installer/staging/x64 | Out-Null
          Copy-Item "$tp/System.Data.SQLite/1.0.118/x86/SQLite.Interop.dll" installer/staging/x86/
          Copy-Item "$tp/System.Data.SQLite/1.0.118/x64/SQLite.Interop.dll" installer/staging/x64/
          # recursos: TODO el árbol (img con iconos, fuentes, fondos, biblias)
          # (destino = staging ya existente: resources queda como staging/resources)
          Copy-Item resources installer/staging -Recurse -Force
          # presupuesto de instalador (≤10 MB aprobado): el módulo de muestra
          # e-Sword (4,4 MB) permanece en el repo para pruebas/import, no viaja
          Remove-Item installer/staging/resources/data/sample -Recurse -Force -ErrorAction SilentlyContinue
          # verificación de assets críticos de la fusión web (v2.1)
          if (-not (Test-Path installer/staging/resources/fonts)) { throw 'faltan fuentes de la GUI' }
          if (-not (Test-Path installer/staging/resources/backgrounds)) { throw 'faltan fondos de la referencia' }
          if (-not (Test-Path installer/staging/resources/img/icons)) { throw 'faltan iconos Tabler' }
          # v2.2: sets completos (62 iconos × 4 tintas) + logo para la barra
          foreach ($set in @('ink20','ink32','white20','accent20')) {
            $n = (Get-ChildItem "installer/staging/resources/img/icons/$set" -Filter *.png -ErrorAction SilentlyContinue).Count
            if ($n -lt 62) { throw "set de iconos $set incompleto ($n < 62)" }
          }
          foreach ($must in @('eye','piano','wand','chevrons-left','chevrons-right','device-floppy','folder-open','activity')) {
            if (-not (Test-Path "installer/staging/resources/img/icons/ink20/$must.png")) { throw "falta icono nuevo: $must" }
          }
          if (-not (Test-Path installer/staging/resources/img/lumina-logo-32.png)) { throw 'falta logo Lumina 32px' }
          if ((Get-ChildItem installer/staging/resources/data/bibles -Filter *.json -ErrorAction SilentlyContinue).Count -lt 4) { throw 'faltan las 4 biblias completas' }
          # arranque: FusionHP.exe final por arquitectura (renombrado al instalar)
          Get-ChildItem installer/staging
          if (-not (Test-Path installer/staging/FusionHP.x86.exe)) { throw 'falta núcleo x86' }
          if (-not (Test-Path installer/staging/FusionHP.x64.exe)) { throw 'falta núcleo x64' }

      - name: Compilar instalador Inno Setup (dual)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = Get-ChildItem "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue }
          if (-not $iscc) { throw 'Inno Setup 6 no está instalado en el runner' }
          & $iscc.FullName installer/FusionHP.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC falló' }
          Get-ChildItem dist/installer

      - name: Construir portable (x86 universal + x64 opcional)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          # portable x86 (arranca en cualquier Windows 7+)
          New-Item -ItemType Directory -Force -Path portable/FusionHP-Portable | Out-Null
          Copy-Item installer/staging/FusionHP.x86.exe       portable/FusionHP-Portable/FusionHP.exe
          Copy-Item installer/staging/FusionShared.dll       portable/FusionHP-Portable/
          Copy-Item installer/staging/FusionStudio.exe       portable/FusionHP-Portable/
          Copy-Item installer/staging/FusionStudio.Lite.exe  portable/FusionHP-Portable/
          Copy-Item installer/staging/resources              portable/FusionHP-Portable/resources -Recurse
          Set-Content portable/FusionHP-Portable/portable.flag "# Fusion HP modo portable: datos junto al programa"
          Set-Content portable/FusionHP-Portable/LEEME.txt "Fusion HP (portable): ejecuta FusionHP.exe. Los datos viven en la carpeta 'datos'."
          Compress-Archive -Path portable/FusionHP-Portable -DestinationPath dist/FusionHP-Portable-x86.zip -Force
          # portable x64
          New-Item -ItemType Directory -Force -Path portable/FusionHP-Portable-x64 | Out-Null
          Copy-Item installer/staging/FusionHP.x64.exe       portable/FusionHP-Portable-x64/FusionHP.exe
          Copy-Item installer/staging/FusionShared.dll       portable/FusionHP-Portable-x64/
          Copy-Item installer/staging/FusionStudio.exe       portable/FusionHP-Portable-x64/
          Copy-Item installer/staging/FusionStudio.Lite.exe  portable/FusionHP-Portable-x64/
          Copy-Item installer/staging/resources              portable/FusionHP-Portable-x64/resources -Recurse
          Set-Content portable/FusionHP-Portable-x64/portable.flag "# Fusion HP modo portable"
          Set-Content portable/FusionHP-Portable-x64/LEEME.txt "Fusion HP (portable x64): ejecuta FusionHP.exe."
          Compress-Archive -Path portable/FusionHP-Portable-x64 -DestinationPath dist/FusionHP-Portable-x64.zip -Force

      - name: Checksums SHA256
        shell: pwsh
        run: |
          # Recolectar antes de escribir: el propio SUMS no puede hashearse abierto
          $lines = Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $h = Get-FileHash $_.FullName -Algorithm SHA256
              "{0}  {1}" -f $h.Hash, $_.Name
            }
          $lines | Out-File dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Subir instalador y portable
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/installer/*.exe
            dist/FusionHP-Portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # ---------------------------------------------------------------- release en tags
  release:
    name: Release (solo en tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [instalador]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Crear release con artefactos
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/installer/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
